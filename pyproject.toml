[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asa"
version = "0.1.0"
description = "Annotation Shortcut Audit: what did the model learn from the calipers?"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
asa = ["py.typed"]
