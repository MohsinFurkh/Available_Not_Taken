name: full_matrix
dataset: fetal_planes

regimes: ["r_naive", "r_clean", "r_supervised"]

model:
  backbone: resnet50
  pretrained: imagenet
  image_size: 224

split:
  n_folds: 5
  n_seeds: 5           # 25 runs per configuration; seed variance is reported
  seed0: 1000          # separately from fold variance (Section 9)
  val_fraction: 0.15
  stratify: true
  use_official_folds: true

train:
  epochs: 40
  batch_size: 64
  lr: 3.0e-4
  weight_decay: 1.0e-4
  optimizer: adamw
  scheduler: cosine
  warmup_epochs: 2
  early_stop_patience: 8
  num_workers: 2
  amp: true
  label_budget: 1.0                  # sweep 0.01/0.05/0.10/0.25/0.50/1.0 for SO2
  annotation_randomising_aug: false  # ablation A6 flips this

aux:
  # R-supervised: annotation content as explicit weak supervision. Populated
  # from asa.annot.parse; fields with too few parses are dropped automatically.
  enabled: true
  categorical_fields: ["vendor", "preset", "probe", "laterality"]
  numeric_fields: ["depth_cm", "gain", "caliper_separation"]
  lambda_aux: 1.0                    # ablation A10 sweeps this, including 0

eval:
  test_variants: ["a_full", "a_removed", "a_only", "ctrl_random"]
  calibration_bins: 15
  bootstrap_replicates: 2000
  saliency: true
  saliency_max_images: 512

output_dir: runs/full_matrix
