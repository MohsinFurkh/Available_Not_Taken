
name: step4b_available_vs_taken
dataset: fetal_planes

regimes: ["r_annotation_only"]

model:
  backbone: resnet50
  pretrained: imagenet
  image_size: 224

split:
  n_folds: 5
  n_seeds: 2
  seed0: 1000
  val_fraction: 0.15
  stratify: true
  use_official_folds: true

train:
  epochs: 20          # longer than the gate: a weak signal needs more budget
  batch_size: 64
  lr: 3.0e-4
  weight_decay: 1.0e-4
  optimizer: adamw
  scheduler: cosine
  warmup_epochs: 1
  early_stop_patience: 6
  num_workers: 2
  amp: true

eval:
  test_variants: ["a_only", "a_full", "a_removed"]
  calibration_bins: 15
  bootstrap_replicates: 2000
  saliency: false

aux:
  enabled: false

output_dir: runs/step4b_available_vs_taken
