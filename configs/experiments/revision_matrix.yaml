name: revision_matrix
dataset: fetal_planes

regimes: ["r_naive", "r_clean"]

model:
  backbone: resnet50
  pretrained: imagenet
  image_size: 224

split:
  n_folds: 5
  n_seeds: 5
  seed0: 1000
  val_fraction: 0.15
  stratify: true
  use_official_folds: true

train:
  epochs: 12
  batch_size: 64
  lr: 3.0e-4
  weight_decay: 1.0e-4
  optimizer: adamw
  scheduler: cosine
  warmup_epochs: 1
  early_stop_patience: 4
  num_workers: 2
  amp: true

eval:
  test_variants: ["a_full", "a_removed", "a_only", "ctrl_random"]
  calibration_bins: 15
  bootstrap_replicates: 2000
  save_predictions: true
  saliency: false

aux:
  enabled: false

output_dir: runs/revision_matrix
